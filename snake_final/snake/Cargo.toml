[package]
name = "snake"
version = "0.1.0"
edition = "2021" # Use 2021 as it has broader support for some no_std crates

[dependencies]
bootloader = { version = "0.9.34", features = ["map_physical_memory"] }
pic8259 = "0.10"
volatile = "0.2.6"
spin = "0.9.8"
x86_64 = "0.14.2"
linked_list_allocator = "0.10.5"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package.metadata.bootimage]
run-args = ["-no-reboot", "-d", "int,cpu_reset", "-serial", "stdio"]